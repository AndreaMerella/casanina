<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="21cm" height="9cm"
     viewBox="0 0 210 90">

  <!-- Outdoor vinyl sticker — dark base hides weathering -->
  <rect width="210" height="90" fill="#1c1917"/>

  <!-- Subtle border -->
  <rect x="1.5" y="1.5" width="207" height="87" rx="4"
        fill="none" stroke="#faf8f4" stroke-width="0.6" opacity="0.25"/>

  <!-- Vertical divider (between text and QR) -->
  <line x1="135" y1="12" x2="135" y2="78"
        stroke="#faf8f4" stroke-width="0.4" opacity="0.2"/>

  <!-- ══ TEXT SECTION (left) ══ -->

  <!-- "Casa Nina" — large serif -->
  <text x="14" y="44"
    font-family="Georgia,&apos;Times New Roman&apos;,serif"
    font-size="30"
    fill="#faf8f4"
    letter-spacing="0.6">Casa Nina</text>

  <!-- "CARIGNANO" — small caps tracking -->
  <text x="16" y="59"
    font-family="Georgia,&apos;Times New Roman&apos;,serif"
    font-size="10"
    fill="#faf8f4"
    opacity="0.55"
    letter-spacing="5.5">CARIGNANO</text>

  <!-- Thin rule -->
  <line x1="15" y1="66" x2="122" y2="66"
        stroke="#faf8f4" stroke-width="0.4" opacity="0.25"/>

  <!-- URL -->
  <text x="15" y="76"
    font-family="Helvetica,Arial,sans-serif"
    font-size="7.2"
    fill="#faf8f4"
    opacity="0.55"
    letter-spacing="0.3">casaninacarignano.com</text>

  <!-- ══ QR CODE SECTION (right) ══ -->

  <!-- White bg for QR readability -->
  <rect x="140" y="9" width="63" height="72" rx="3" fill="#ffffff"/>

  <!-- QR image (embedded) -->
  <image x="142" y="11" width="59" height="68"
    href="data:image/png;base64,"
    preserveAspectRatio="xMidYMid meet"/>

  <!-- "SCAN TO BOOK" label -->
  <text x="171" y="86" text-anchor="middle"
    font-family="Helvetica,Arial,sans-serif"
    font-size="4.5"
    fill="#faf8f4"
    opacity="0.45"
    letter-spacing="1.2">SCAN TO BOOK</text>

</svg>